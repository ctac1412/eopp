# HTTP - public extension endpoints and HTTPS redirect for the web UI.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Accept, Content-Type, Authorization" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /rucaptcha.txt {
        root /opt/eopp;
        default_type "text/plain";
        try_files /rucaptcha.txt =404;
    }

    location /solve-captcha {
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass https://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;
    }

    location /register-usage {
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass https://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;
    }

    location /confirm-usage {
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass https://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;
    }

    location /fail-usage {
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass https://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;
    }

    location /validate-key {
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass https://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;
    }

    location /api-key-status {
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass https://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;
    }

    location /stream {
        proxy_pass https://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;
        proxy_buffering off;
        proxy_cache off;
    }

    location /check-stream {
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass https://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;
        proxy_buffering off;
        proxy_cache off;
    }

    location /rucaptcha-callback {
        limit_except POST { deny all; }
        proxy_pass https://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - web UI and public extension endpoints without basic auth.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate /opt/eopp/certs/cert.pem;
    ssl_certificate_key /opt/eopp/certs/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /rucaptcha.txt {
        root /opt/eopp;
        default_type "text/plain";
        try_files /rucaptcha.txt =404;
    }

    location /plugins/ {
        proxy_pass https://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
    }

    location /solve-captcha {
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass https://127.0.0.1:8765;
