services:
  eopp-prod:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - ./server/data:/app/data
      - ./server/certs:/app/certs:ro
      - ./plugins:/app/plugins
    environment:
      - EOPP_DB_PATH=/app/data/api_keys.db
      - EOPP_DATA_DIR=/app/data
      - EOPP_BACKEND_LOG_PATH=/app/data/backend.log
      - EOPP_PLUGINS_DIR=/app/plugins
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_TIMEOUT_SECONDS=${TELEGRAM_TIMEOUT_SECONDS:-5}
      - TELEGRAM_DAILY_REPORT_HOUR=${TELEGRAM_DAILY_REPORT_HOUR:-12}
      - TELEGRAM_DAILY_REPORT_MINUTE=${TELEGRAM_DAILY_REPORT_MINUTE:-10}
      - RUCAPTCHA_API_KEY=${RUCAPTCHA_API_KEY:-}
      - RUCAPTCHA_CALLBACK_URL=${RUCAPTCHA_CALLBACK_URL:-}
      - EOPP_AUTO_SOLVER_ENABLED=${EOPP_AUTO_SOLVER_ENABLED:-1}
    command: ["python", "scripts/run_with_log.py", "/app/data/backend.log", "python", "server/manage.py", "--host", "0.0.0.0"]
    restart: unless-stopped

  sqlite-web:
    image: coleifer/sqlite-web
    ports:
      - "8081:8080"
    volumes:
      - ./server/data:/data
    environment:
      - SQLITE_DATABASE=api_keys.db
      - SQLITE_WEB_PASSWORD=changeme
    command: ["/bin/ash", "-c", "sqlite_web -H 0.0.0.0 -x $$SQLITE_DATABASE -u /sqlite-web/ -P"]
    restart: unless-stopped
