# HTTP - API endpoints for extension (no auth, no SSL)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # CORS headers
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Accept, Content-Type, Authorization" always;

    # ACME challenge for Let's Encrypt (IP certificates via webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # API endpoints (no auth)
    location /solve-captcha {
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass https://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;
    }

    location /confirm-usage {
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass https://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;
    }

    location /fail-usage {
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass https://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;
    }

    location /api-key-status {
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass https://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;
    }

    location /register-usage {
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass https://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;
    }

    location /stream {
        proxy_pass https://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;
        proxy_buffering off;
        proxy_cache off;
    }

    location /validate-key {
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass https://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;
    }

    # Web UI - redirect to HTTPS
    location /check-stream {
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass https://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Web UI only (with basic auth)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate /opt/eopp/certs/cert.pem;
    ssl_certificate_key /opt/eopp/certs/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    auth_basic "Restricted Area";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Extension auto-update files must be publicly accessible (no basic auth)
    location /plugins/ {
        auth_basic off;
        proxy_pass https://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
    }

    location / {
        proxy_pass https://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
    }

    # SQLite Web - proxied without separate auth (uses sqlite-web built-in password)
    location /sqlite-web/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
