<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>🔊 Все звуки EOPP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#0d1117;color:#c9d1d9;padding:24px;display:flex;gap:24px;flex-wrap:wrap}
.panel{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:20px;min-width:320px}
h2{color:#f0f6fc;font-size:14px;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid #30363d}
.btn{display:block;width:100%;margin:4px 0;padding:10px 16px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#c9d1d9;cursor:pointer;font-size:14px;text-align:left}
.btn:hover{background:#21262d;border-color:#58a6ff}
.btn .tag{float:right;font-size:11px;color:#8b949e;margin-top:1px}
.row{display:flex;gap:8px;margin:8px 0}
.row input,.row select{flex:1;padding:6px 8px;background:#0d1117;border:1px solid #30363d;border-radius:4px;color:#c9d1d9;font-size:13px}
.row button{padding:6px 12px;background:#238636;border:none;border-radius:4px;color:#fff;cursor:pointer;font-size:13px}
.row button:hover{background:#2ea043}
label{font-size:11px;color:#8b949e;display:block;margin:8px 0 2px}
</style>
</head>
<body>

<div class="panel">
<h2>📢 Системные звуки</h2>
<button class="btn" onclick="s.newCaptcha()"><span class="tag">880→1100</span>🔔 Новая капча (мастер)</button>
<button class="btn" onclick="s.opCaptcha()"><span class="tag">660→880</span>🔔 Новая капча (оператор)</button>
<button class="btn" onclick="s.chat()"><span class="tag">600Hz</span>💬 Сообщение в чат</button>
<button class="btn" onclick="s.gong()"><span class="tag">520→680</span>🛎️ Плановый запуск</button>
<button class="btn" onclick="s.tick()"><span class="tag">800Hz</span>⏱️ Тик готовности</button>
</div>

<div class="panel">
<h2>🎛️ Конструктор звука</h2>
<label>Частота (Hz)</label>
<div class="row">
  <input id="freq" type="number" value="440" min="20" max="4000">
  <button onclick="s.playTone(+freq.value,+dur.value,wave.value,+vol.value)">▶</button>
</div>
<label>Длительность (сек)</label>
<input id="dur" type="range" value="0.3" min="0.05" max="2" step="0.05" style="width:100%">
<span id="durVal" style="font-size:11px;color:#8b949e">0.3</span>
<label>Волна</label>
<select id="wave">
  <option value="sine" selected>sine (мягкая)</option>
  <option value="triangle">triangle</option>
  <option value="square">square (резкая)</option>
  <option value="sawtooth">sawtooth (металл)</option>
</select>
<label>Громкость</label>
<input id="vol" type="range" value="0.25" min="0.05" max="0.6" step="0.05" style="width:100%">
<span id="volVal" style="font-size:11px;color:#8b949e">0.25</span>
</div>

<div class="panel">
<h2>🔧 Частоты</h2>
<button class="btn" onclick="s.playTone(262,0.4,'sine',0.2)">До (C4) — 262</button>
<button class="btn" onclick="s.playTone(294,0.4,'sine',0.2)">Ре (D4) — 294</button>
<button class="btn" onclick="s.playTone(330,0.4,'sine',0.2)">Ми (E4) — 330</button>
<button class="btn" onclick="s.playTone(349,0.4,'sine',0.2)">Фа (F4) — 349</button>
<button class="btn" onclick="s.playTone(392,0.4,'sine',0.2)">Соль (G4) — 392</button>
<button class="btn" onclick="s.playTone(440,0.4,'sine',0.2)">Ля (A4) — 440</button>
<button class="btn" onclick="s.playTone(494,0.4,'sine',0.2)">Си (B4) — 494</button>
<button class="btn" onclick="s.playTone(523,0.4,'sine',0.2)">До (C5) — 523</button>
</div>

<script>
const ctx=new(window.AudioContext||window.webkitAudioContext)();

const s={
  playTone(f,d,t,v){t=t||"sine";v=v||0.25;const o=ctx.createOscillator(),g=ctx.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+d);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)},
  newCaptcha(){this.playTone(880,0.15);setTimeout(()=>this.playTone(1100,0.2),150)},
  opCaptcha(){this.playTone(660,0.1);setTimeout(()=>this.playTone(880,0.15),100)},
  chat(){this.playTone(600,0.08,"sine",0.15)},
  gong(){this.playTone(520,0.3,"sine",0.18);setTimeout(()=>this.playTone(680,0.4,"sine",0.15),150)},
  tick(){this.playTone(800,0.05,"square",0.1)},
};
dur.oninput=()=>durVal.textContent=dur.value;
vol.oninput=()=>volVal.textContent=vol.value;
</script>
</body>
</html>
